<header class="bar">
  <div class="container bar-inner">
    <a class="brand" href="#inicio" (click)="close()">
      <img src="images/logo.png" [alt]="name" width="184" height="138" />
    </a>

    <nav class="nav" [class.is-open]="open()" id="menu-principal" aria-label="Principal">
      <ul>
        @for (link of links; track link.href) {
          <li><a [href]="link.href" (click)="close()">{{ link.label }}</a></li>
        }
      </ul>
    </nav>

    <div class="actions">
      <a class="btn btn-wa btn-sm" [href]="wa" target="_blank" rel="noopener">
        <app-icon name="whatsapp" [size]="20" />
        <span>Escríbenos</span>
        <span class="sr-only">(se abre WhatsApp en una pestaña nueva)</span>
      </a>
      <button
        type="button"
        class="menu-btn"
        (click)="toggle()"
        [attr.aria-expanded]="open()"
        aria-controls="menu-principal"
      >
        <span class="sr-only">{{ open() ? 'Cerrar menú' : 'Abrir menú' }}</span>
        <span class="burger" [class.is-open]="open()" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <div class="brand-stripe" aria-hidden="true"></div>
</header>
